function mapsSearch(q){return"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q)}
function mapsWalk(q){return"https://www.google.com/maps/dir/?api=1&origin="+encodeURIComponent(HOTEL)+
  "&destination="+encodeURIComponent(q)+"&travelmode=walking"}

const TILE={light:"https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
            dark:"https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png"};
const map=L.map("lmap",{scrollWheelZoom:false,zoomControl:true})
           .setView([PT.hotel.lat,PT.hotel.lon],13);
let tiles=L.tileLayer(TILE[dark()?"dark":"light"],{maxZoom:19,subdomains:"abcd",
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'}).addTo(map);
matchMedia("(prefers-color-scheme:dark)").addEventListener("change",()=>{
  map.removeLayer(tiles);
  tiles=L.tileLayer(TILE[dark()?"dark":"light"],{maxZoom:19,subdomains:"abcd",
    attribution:'&copy; OpenStreetMap &copy; CARTO'}).addTo(map);
  drawRings(); redraw();
});

const rings=L.layerGroup().addTo(map);
const MIN=[5,10,15,20,30];          // minuty marszu
const MPM=64;                        // 80 m/min minus 25% na krety uklad ulic
function drawRings(){
  rings.clearLayers();
  const h=PT.hotel, c=getComputedStyle(document.documentElement).getPropertyValue("--quiet").trim();
  MIN.forEach(m=>{
    const r=m*MPM;
    L.circle([h.lat,h.lon],{radius:r,color:c,weight:1,opacity:.45,dashArray:"3 7",
      fill:false,interactive:false}).addTo(rings);
    L.marker([h.lat+r/111320,h.lon],{interactive:false,keyboard:false,
      icon:L.divIcon({className:"ringlab",html:m+" min",iconSize:[46,14],iconAnchor:[23,7]})}).addTo(rings);
  });
}
drawRings();
let layer=L.layerGroup().addTo(map), marks={}, current=0;
const lmapEl=document.getElementById("lmap");
function labelGate(){lmapEl.classList.toggle("zoomout",map.getZoom()<14)}
map.on("zoomend",labelGate);
function icon(color,base,label,shape){
  const cls = shape==="sq" ? "mk sq" : shape==="sqo" ? "mk sqo" : "mk"+(base?" base":"");
  const st = shape==="sqo" ? 'style="color:'+color+'"' : 'style="background:'+color+'"';
  return L.divIcon({className:"mkwrap",iconSize:[15,15],iconAnchor:[7,7],
    html:'<span class="'+cls+'" '+st+'></span><span class="mklabel">'+label+'</span>'});
}
function redraw(){
  layer.clearLayers(); marks={};
  const day=DAYS[current], seen={}, pts=[];
  window.__seen=seen;
  day.items.forEach(it=>{ if(!seen[it.p]) seen[it.p]={k:it.k,items:[]}; seen[it.p].items.push(it); });
  Object.entries(seen).forEach(([id,g])=>{
    const p=PT[id]; if(!p) return;
    const m=L.marker([p.lat,p.lon],{icon:icon(col(g.k),false,p.l)}).addTo(layer);
    const it=g.items[0];
    m.bindPopup('<b>'+g.items.map(x=>x.h).join(" / ")+'</b>'+
      '<span class="pn">'+it.n+'</span>'+
      '<a href="'+mapsSearch(it.q)+'" target="_blank" rel="noopener">Google Maps</a>'+
      '<a href="'+mapsWalk(it.q)+'" target="_blank" rel="noopener">trasa pieszo</a>');
    marks[id]=m; pts.push([p.lat,p.lon]);
  });
  const seenEat=new Set();
  (day.lunch||[]).concat(day.dinner?[day.dinner]:[]).forEach(e=>{
    const p=PT[e.p]; if(!p||seen[e.p]||seenEat.has(e.p)) return; seenEat.add(e.p);
    const m=L.marker([p.lat,p.lon],{icon:icon(col("food"),false,p.l,"sq")}).addTo(layer);
    m.bindPopup('<b>'+e.h+'</b><span class="pn">'+e.n+'</span>'+
      '<a href="'+mapsSearch(e.q)+'" target="_blank" rel="noopener">Google Maps</a>');
    marks[e.p]=m; pts.push([p.lat,p.lon]);
  });
  (day.cafe||[]).forEach(e=>{
    const p=PT[e.p]; if(!p||seen[e.p]||seenEat.has(e.p)) return; seenEat.add(e.p);
    const m=L.marker([p.lat,p.lon],{icon:icon(col("food"),false,p.l,"sqo")}).addTo(layer);
    m.bindPopup('<b>'+e.h+'</b><span class="pn">'+e.n+'</span>'+
      '<a href="'+mapsSearch(e.q)+'" target="_blank" rel="noopener">Google Maps</a>');
    marks[e.p]=m; pts.push([p.lat,p.lon]);
  });
  const h=PT.hotel;
  const hm=L.marker([h.lat,h.lon],{icon:icon(dark()?"#E7EDEF":"#15191B",true,"Hotel")}).addTo(layer);
  hm.bindPopup('<b>Hotel</b><span class="pn">Residence Inn Kensington, 181-183 Warwick Road</span>'+
    '<a href="'+mapsSearch(HOTEL)+'" target="_blank" rel="noopener">Google Maps</a>');
  marks.hotel=hm; pts.push([h.lat,h.lon]);
  if(pts.length>1) map.fitBounds(L.latLngBounds(pts).pad(0.22));
  else map.setView(pts[0],15);
  labelGate();
}

const railG=document.getElementById("rail");
DAYS.forEach((day,i)=>{
  const b=document.createElement("button");
  b.className="day";b.setAttribute("role","tab");b.setAttribute("aria-selected",i===0);
  b.innerHTML='<span class="d">'+day.d+'</span><span class="n">'+day.n+'</span>';
  b.setAttribute("aria-label",day.d+" "+day.n+" sierpnia - "+day.t);
  b.addEventListener("click",()=>{select(i);});
  railG.append(b);
});

function select(i){
  current=i; const day=DAYS[i];
  [...railG.children].forEach((b,j)=>b.setAttribute("aria-selected",j===i));
  document.getElementById("dtitle").textContent=day.title;
  const ol=document.getElementById("items");ol.innerHTML="";
  ol.style.animation="none"; void ol.offsetWidth; ol.style.animation="";
  if(window.scrollY>240){
    const rm=matchMedia("(prefers-reduced-motion: reduce)").matches;
    window.scrollTo({top:0,behavior:rm?"auto":"smooth"});
  }
  day.items.forEach(it=>{
    const li=document.createElement("li");li.className="item";
    const dist=it.w>0?'<span class="dist">'+it.w+' min pieszo z hotelu</span>':'';
    const walk=it.w>0?'<a href="'+mapsWalk(it.q)+'" target="_blank" rel="noopener">trasa pieszo</a>':'';
    li.innerHTML='<span class="slot">'+it.s+'</span><div class="what">'+
      '<h3><a href="'+mapsSearch(it.q)+'" target="_blank" rel="noopener">'+it.h+'</a></h3>'+
      '<span class="chip" style="color:'+col(it.k)+'">'+CN[it.k]+'</span>'+
      '<p class="note">'+it.n+'</p>'+
      '<p class="go"><button type="button" class="hereb">mapa</button>'+
      '<a href="'+mapsSearch(it.q)+'" target="_blank" rel="noopener">otwórz w Google</a>'+walk+dist+'</p></div>';
    li.querySelector(".hereb").addEventListener("click",()=>{
      const m=marks[it.p]; if(!m) return;
      map.setView(m.getLatLng(),16,{animate:true}); m.openPopup();
      document.querySelector(".mapcard").scrollIntoView({behavior:"smooth",block:"start"});
    });
    li.addEventListener("pointerenter",()=>{const m=marks[it.p];if(m)m._icon&&m._icon.classList.add("hot")});
    li.addEventListener("pointerleave",()=>{const m=marks[it.p];if(m)m._icon&&m._icon.classList.remove("hot")});
    ol.append(li);
  });
  const oldEat=document.querySelector(".eat"); if(oldEat) oldEat.remove();
  if(day.lunch||day.cafe||day.dinner){
    const div=document.createElement("div"); div.className="eat";
    const row=(lab,arr)=>{ if(!arr||!arr.length) return "";
      return '<div class="row"><span class="lab">'+lab+'</span><div class="cards">'+arr.map(e=>
        '<a href="'+mapsSearch(e.q)+'" target="_blank" rel="noopener" data-p="'+e.p+'"><b>'+e.h+'</b> <span>'+e.n+'</span></a>').join("")+'</div></div>';};
    div.innerHTML=row("lunch",day.lunch)+row("kawa",day.cafe)+row("kolacja",day.dinner?[day.dinner]:null);
    div.querySelectorAll("a[data-p]").forEach(a=>{
      a.addEventListener("pointerenter",()=>{const m=marks[a.dataset.p];if(m&&m._icon)m._icon.classList.add("hot")});
      a.addEventListener("pointerleave",()=>{const m=marks[a.dataset.p];if(m&&m._icon)m._icon.classList.remove("hot")});
    });
    ol.after(div);
  }
  redraw();
}
select(0);

</script>
