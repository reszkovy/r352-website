<style>
  .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:.5rem}
  .gal a{display:block;background:var(--bg);text-decoration:none;color:var(--ink)}

  .gal .t{font-size:.92rem;font-weight:700;padding:.8rem 1rem .15rem;letter-spacing:-.01em;line-height:1.35}

    <div class="kicker">Fotorelacje ze spektakli, turniejów i obozów</div>
    <h1>Galeria.<br><b>Zobacz, jak u nas jest.</b></h1>
    <p class="lead">Wybrane fotorelacje ze spektakli, turniejów i obozów. Pełne albumy z każdego wydarzenia otwierają się po kliknięciu.</p>
  </header>

  <div class="gal" id="gal"></div>

  <div data-aff-footer></div>
</div>
<script src="galerie.js"></script>
<script>
(function(){"use strict";
  var A=window.AFF_GAL||[], box=document.getElementById("gal");
  box.innerHTML=A.map(function(a){
    return '<a href="album.html?id='+a.id+'">'+
      '<div class="ph-media" style="background-image:url(foto/albumy/'+a.id+'-1.jpg);background-size:cover;background-position:center"></div>'+
      '<div class="t">'+a.t+'</div><div class="d">'+a.n+' zdjęć</div></a>';
  }).join("");
})();
</script>
<script defer src="menu.js?v=1e8a8896"></script>
