    <!-- Font loading.
         Chrome/Firefox/Edge: Tanker (Fontshare) for display + BW Haas Head (cdnfonts) for body.
         Safari: Tanker (Fontshare - should now load with proper crossorigin) + Plus Jakarta Sans
         (Google Fonts - rock-solid Safari CORS, free, variable). The html.safari class switches
         body stack to Plus Jakarta Sans. Tanker is shared across all browsers as display font. -->
    <link rel="preconnect" href="https://fonts.cdnfonts.com" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Tanker (display) is self-hosted in /public/fonts + src/styles/fonts.css, so the
         Fontshare CDN link was removed: it added a CORS-blocked request and nothing else.

         The two remaining external font stylesheets are loaded NON-render-blocking via the
         media="print" onload swap. cdnfonts (BW Haas Head, non-Safari body) has been flaky /
         returning 500; loaded render-blocking it stalls first paint and the page looks hung.
         As print-media it never blocks paint - the fallback stack (Helvetica Neue / Arial)
         shows instantly and the webfont swaps in if/when it loads. <noscript> keeps it working
         with JS disabled. -->
    <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/bw-haas-head" crossorigin="anonymous" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript>

      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" />
    </noscript>

    <!-- Safari font fallback - Fontshare/cdnfonts.com don't load reliably on Safari/iOS Safari.
         Instead of fighting CDN issues, we detect Safari and swap to native system font stack (SF Pro Display).
         Zero external load, instant render, looks native on Apple devices. -->
    <script>
      (function() {
        try {
          var ua = navigator.userAgent || "";
          var isSafari = /Safari/.test(ua) && !/Chrome|Chromium|Edg|OPR|CriOS|FxiOS/.test(ua);
          if (isSafari) {
            document.documentElement.classList.add("safari");
          }
        } catch (e) { /* noop */ }
      })();
    </script>

    <script>
      (function () {
        var s = document.getElementById("r352-splash");
        if (!s) return;
        if (navigator.webdriver) return;
        try {
          if (sessionStorage.getItem("r352-splash") === "1") {
            s.parentNode && s.parentNode.removeChild(s);
            return;
          }
          sessionStorage.setItem("r352-splash", "1");
        } catch (e) {}
        var reduce = false;
        try { reduce = matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}
        var hold = reduce ? 350 : 1650;
        setTimeout(function () {
          s.classList.add("r352-splash-hide");
          setTimeout(function () { s.parentNode && s.parentNode.removeChild(s); }, 800);
        }, hold);
      })();
    </script>
