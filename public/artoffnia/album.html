<style>
  .crumb{font-size:.74rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mid);padding-top:2rem}
  .crumb a{color:var(--mid);text-decoration:none}
  .crumb a:hover{color:var(--ink)}
  .alb{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:1.6rem}
  .alb figure{margin:0;background:var(--ph);aspect-ratio:3/2;overflow:hidden;cursor:zoom-in}
  .alb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s ease}
  .alb figure:hover img{transform:scale(1.05)}
  .lb{position:fixed;inset:0;background:rgba(17,17,16,.94);z-index:1000;display:none;align-items:center;justify-content:center;padding:2rem}
  .lb.on{display:flex}
  .lb img{max-width:92vw;max-height:86vh;object-fit:contain;display:block}
  .lb-x,.lb-p,.lb-n{position:absolute;background:none;border:1px solid rgba(250,250,248,.45);color:#FAFAF8;border-radius:999px;width:48px;height:48px;font-size:1.2rem;cursor:pointer;transition:.15s}
  .lb-x:hover,.lb-p:hover,.lb-n:hover{background:#FAFAF8;color:var(--ink)}
  .lb-x{top:1.4rem;right:1.4rem}
  .lb-p{left:1.4rem;top:50%;transform:translateY(-50%)}
  .lb-n{right:1.4rem;top:50%;transform:translateY(-50%)}
  .lb-c{position:absolute;bottom:1.4rem;left:0;right:0;text-align:center;color:rgba(250,250,248,.7);font-size:.8rem;letter-spacing:.1em}
</style>
</head>
<body>
<a class="skip-link" href="#tresc">Przejdź do treści</a>

<div class="wrap">
  <div data-aff-nav></div>
  <div id="tresc" tabindex="-1"></div>

  <div class="crumb"><a href="galeria.html">Galeria</a> · <span id="a-crumb"></span></div>
  <header class="page-head" style="padding-bottom:.6rem">
    <div class="kicker" id="a-kicker"></div>
    <h1 id="a-title" style="font-weight:800"></h1>
    <p class="lead" id="a-lead"></p>
  </header>

  <div class="alb" id="a-grid"></div>

  <p style="margin-top:2rem"><a class="txtlink" href="galeria.html">← Wszystkie fotorelacje</a></p>

  <div data-aff-footer></div>
</div>

<div class="lb" id="lb" role="dialog" aria-label="Podgląd zdjęcia">
  <button type="button" class="lb-x" aria-label="Zamknij">✕</button>
  <button type="button" class="lb-p" aria-label="Poprzednie">‹</button>
  <img id="lb-img" src="" alt="">
  <button type="button" class="lb-n" aria-label="Następne">›</button>
  <div class="lb-c" id="lb-c"></div>
</div>

<script src="galerie.js"></script>
<script>
(function(){
"use strict";
var ALB=null;
var id=new URLSearchParams(location.search).get("id");
var _g=(window.AFF_GAL||[]).filter(function(x){return x.id===id;})[0];
var a=_g?{t:_g.t,k:"Fotorelacja",n:_g.n,d:""}:null;
if(!a){ location.replace("galeria.html"); return; }
AFF_META("album.html?id="+id, a.t+" — ARToffNIA", a.d, "foto/albumy/"+id+"-1.webp");
document.getElementById("a-crumb").textContent=a.t;
document.getElementById("a-kicker").textContent=a.k;
document.getElementById("a-title").textContent=a.t;
document.getElementById("a-lead").textContent=a.d;
var grid=document.getElementById("a-grid"), imgs=[];
for(var i=1;i<=a.n;i++){
  var src="foto/albumy/"+id+"-"+i+".webp";
  imgs.push(src);
  var fig=document.createElement("figure");
  fig.innerHTML='<img src="'+src+'" alt="'+a.t+' — zdjęcie '+i+'" loading="lazy">';
  (function(k){fig.addEventListener("click",function(){open(k);});})(i-1);
  grid.appendChild(fig);
}
var lb=document.getElementById("lb"), lbi=document.getElementById("lb-img"), lbc=document.getElementById("lb-c"), cur=0;
function open(k){ cur=k; show(); lb.classList.add("on"); document.body.style.overflow="hidden"; }
function show(){ lbi.src=imgs[cur]; lbc.textContent=(cur+1)+" / "+imgs.length+" · "+a.t; }
function close(){ lb.classList.remove("on"); document.body.style.overflow=""; }
function step(d){ cur=(cur+d+imgs.length)%imgs.length; show(); }
lb.querySelector(".lb-x").onclick=close;
lb.querySelector(".lb-p").onclick=function(e){e.stopPropagation();step(-1);};
lb.querySelector(".lb-n").onclick=function(e){e.stopPropagation();step(1);};
lb.addEventListener("click",function(e){ if(e.target===lb)close(); });
document.addEventListener("keydown",function(e){
  if(!lb.classList.contains("on"))return;
  if(e.key==="Escape")close(); if(e.key==="ArrowLeft")step(-1); if(e.key==="ArrowRight")step(1);
});
})();
</script>
<script defer src="menu.js?v=1e8a8896"></script>
</body>
