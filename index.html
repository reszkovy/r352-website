
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>r352 - Design operations for brands and agencies.</title>
    <meta name="description" content="Design, systems & AI - design operations for brands and agencies delivering at scale. r352 builds the operating system behind great design - from strategy to rollout-ready delivery, powered by the r3loop methodology." />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <!-- NOTE: no static canonical/hreflang here - react-helmet-async (SEO.tsx)
         injects the per-route canonical + hreflang. A static canonical in this
         template would get baked into EVERY prerendered page as a duplicate
         pointing at the homepage. -->

    <!-- Open Graph (fallback - overridden per route by react-helmet-async) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="r352" />
    <meta property="og:title" content="r352 - Design operations for brands and agencies." />
    <meta property="og:description" content="Design operations for brands and agencies delivering at scale. From strategy to rollout-ready delivery, powered by the r3loop methodology - predictable quality and speed at scale." />
    <meta property="og:url" content="https://www.r352.com" />
    <meta property="og:image" content="https://www.r352.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="r352 - Design operations for brands and agencies." />
    <meta name="twitter:description" content="Design operations for brands and agencies. From strategy to rollout-ready delivery, powered by the r3loop methodology." />
    <meta name="twitter:image" content="https://www.r352.com/og-image.png" />

    <!-- Font loading.
         Chrome/Firefox/Edge: Tanker (Fontshare) for display + BW Haas Head (cdnfonts) for body.
         Safari: Tanker (Fontshare - should now load with proper crossorigin) + Plus Jakarta Sans
         (Google Fonts - rock-solid Safari CORS, free, variable). The html.safari class switches
         body stack to Plus Jakarta Sans. Tanker is shared across all browsers as display font. -->
    <link rel="preconnect" href="https://fonts.cdnfonts.com" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Tanker (display) is self-hosted in /public/fonts + src/styles/fonts.css, so the
         Fontshare CDN link was removed: it added a CORS-blocked request and nothing else.

         The two remaining external font stylesheets are loaded NON-render-blocking via the
         media="print" onload swap. cdnfonts (BW Haas Head, non-Safari body) has been flaky /
         returning 500; loaded render-blocking it stalls first paint and the page looks hung.
         As print-media it never blocks paint - the fallback stack (Helvetica Neue / Arial)
         shows instantly and the webfont swaps in if/when it loads. <noscript> keeps it working
         with JS disabled. -->
    <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/bw-haas-head" crossorigin="anonymous" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/bw-haas-head" crossorigin="anonymous" />
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" />
    </noscript>

    <!-- Favicon family - covers modern SVG, legacy ICO, all common PNG sizes,
         Apple touch icon, and PWA manifest. Order matters: modern first, legacy last. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0A0A0A" />

    <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>

    <!-- Safari font fallback - Fontshare/cdnfonts.com don't load reliably on Safari/iOS Safari.
         Instead of fighting CDN issues, we detect Safari and swap to native system font stack (SF Pro Display).
         Zero external load, instant render, looks native on Apple devices. -->
    <script>
      (function() {
        try {
          var ua = navigator.userAgent || "";
          var isSafari = /Safari/.test(ua) && !/Chrome|Chromium|Edg|OPR|CriOS|FxiOS/.test(ua);
          if (isSafari) {
            document.documentElement.classList.add("safari");
          }
        } catch (e) { /* noop */ }
      })();
    </script>
  </head>

  <body>
    <!-- First-load splash. Static (no framework) so it covers the page from the
         very first paint - zero content flash. Wordmark assembles letter by letter,
         then curtains up to reveal the site. Shows once per session; respects
         reduced-motion; self-removes. -->
    <div id="r352-splash" aria-hidden="true">
      <span class="r352-splash-word"><span>r</span><span>3</span><span>5</span><span>2</span></span>
    </div>
    <style>
      #r352-splash{position:fixed;inset:0;z-index:100000;background:#0A0A0A;display:flex;align-items:center;justify-content:center;will-change:transform}
      #r352-splash.r352-splash-hide{transform:translateY(-100%);transition:transform .75s cubic-bezier(.76,0,.24,1)}
      .r352-splash-word{display:flex;gap:.01em;overflow:hidden;font-family:"Tanker","Plus Jakarta Sans",system-ui,-apple-system,sans-serif;font-size:clamp(56px,11vw,128px);line-height:1;letter-spacing:-.02em;color:#fff}
      .r352-splash-word > span{display:inline-block;transform:translateY(115%);opacity:0;animation:r352SplashUp .62s cubic-bezier(.22,1,.36,1) forwards}
      .r352-splash-word > span:nth-child(1){animation-delay:.15s}
      .r352-splash-word > span:nth-child(2){animation-delay:.24s}
      .r352-splash-word > span:nth-child(3){animation-delay:.33s}
      .r352-splash-word > span:nth-child(4){animation-delay:.42s;color:#D4FF00}
      @keyframes r352SplashUp{to{transform:translateY(0);opacity:1}}
      @media (prefers-reduced-motion: reduce){.r352-splash-word > span{animation:none;transform:none;opacity:1}}
    </style>
    <script>
      (function () {
        var s = document.getElementById("r352-splash");
        if (!s) return;
        try {
          if (sessionStorage.getItem("r352-splash") === "1") {
            s.parentNode && s.parentNode.removeChild(s);
            return;
          }
          sessionStorage.setItem("r352-splash", "1");
        } catch (e) { /* private mode - just show it */ }
        var reduce = false;
        try { reduce = matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}
        var hold = reduce ? 300 : 1450;
        setTimeout(function () {
          s.classList.add("r352-splash-hide");
          setTimeout(function () { s.parentNode && s.parentNode.removeChild(s); }, 800);
        }, hold);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
