
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>r352 — We build the system behind great design.</title>
    <meta name="description" content="Strategic design partner for multi-location organizations. r352 builds the operating system behind great design — from strategy to rollout-ready delivery, powered by the r3loop methodology." />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://www.r352.com" />

    <!-- Hreflang — only EN until /pl routing ships. -->
    <link rel="alternate" hreflang="en" href="https://www.r352.com" />
    <link rel="alternate" hreflang="x-default" href="https://www.r352.com" />

    <!-- Open Graph (fallback — overridden per route by react-helmet-async) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="r352" />
    <meta property="og:title" content="r352 — We build the system behind great design." />
    <meta property="og:description" content="Strategic design partner for multi-location organizations. From strategy to rollout-ready delivery, powered by the r3loop methodology — predictable quality and speed at scale." />
    <meta property="og:url" content="https://www.r352.com" />
    <meta property="og:image" content="https://www.r352.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="r352 — We build the system behind great design." />
    <meta name="twitter:description" content="Strategic design partner for multi-location organizations. From strategy to rollout-ready delivery, powered by the r3loop methodology." />
    <meta name="twitter:image" content="https://www.r352.com/og-image.png" />

    <!-- Font loading.
         Chrome/Firefox/Edge: Tanker (Fontshare) for display + BW Haas Head (cdnfonts) for body.
         Safari: Tanker (Fontshare — should now load with proper crossorigin) + Plus Jakarta Sans
         (Google Fonts — rock-solid Safari CORS, free, variable). The html.safari class switches
         body stack to Plus Jakarta Sans. Tanker is shared across all browsers as display font. -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin="anonymous" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.cdnfonts.com" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f%5B%5D=tanker@400&display=swap" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/bw-haas-head" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" />

    <!-- Favicon family — covers modern SVG, legacy ICO, all common PNG sizes,
         Apple touch icon, and PWA manifest. Order matters: modern first, legacy last. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0A0A0A" />

    <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>

    <!-- Safari font fallback — Fontshare/cdnfonts.com don't load reliably on Safari/iOS Safari.
         Instead of fighting CDN issues, we detect Safari and swap to native system font stack (SF Pro Display).
         Zero external load, instant render, looks native on Apple devices. -->
    <script>
      (function() {
        try {
          var ua = navigator.userAgent || "";
          var isSafari = /Safari/.test(ua) && !/Chrome|Chromium|Edg|OPR|CriOS|FxiOS/.test(ua);
          if (isSafari) {
            document.documentElement.classList.add("safari");
          }
        } catch (e) { /* noop */ }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
